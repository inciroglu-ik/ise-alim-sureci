name: Günlük Hatırlatma E-postası

on:
  schedule:
    # 05:00 UTC = Türkiye saatiyle (UTC+3) 08:00
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  hatirlat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Bağımlılıkları kur
        run: npm install firebase-admin nodemailer
      - name: Hatırlatma scriptini çalıştır
        run: node scripts/hatirlatma.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALICI_EPOSTA: ${{ secrets.ALICI_EPOSTA }}

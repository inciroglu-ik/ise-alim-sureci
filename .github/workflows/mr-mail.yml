name: MR Silme Bildirim E-postasi

on:
  schedule:
    # 2 saatte bir (dakika 15) — MR'dan silinen kişilerin müdürlerine otomatik bildirim
    - cron: "15 */2 * * *"
  workflow_dispatch: {}

jobs:
  mrmail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Bağımlılıkları kur
        run: npm install firebase-admin nodemailer
      - name: MR bildirim scriptini çalıştır
        run: node scripts/mr-mail.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

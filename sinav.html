<html lang="tr">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f1a20;--ink-soft:#56676f;--ink-mute:#8b9aa1;
    --paper:#f2f5f4;--panel:#ffffff;--panel-alt:#fafcfb;
    --line:#e2e8e5;--line-strong:#cfdad5;
    --teal-400:#2fb094;--teal:#117a63;--teal-deep:#0b5548;--teal-900:#06342c;
    --teal-50:#f0f8f5;--teal-100:#dcefe9;--teal-200:#bde0d5;
    --brass:#a56d16;--good:#2f6b45;--good-bg:#e6f3ea;--warn:#95541a;--warn-bg:#fbeedd;
    --bad:#9c2b2b;--bad-bg:#fbe8e8;--bad-line:#efc9c9;
    --r-sm:9px;--r:13px;--r-lg:18px;--r-xl:24px;--ease:cubic-bezier(.2,.7,.3,1);--sh-teal:0 8px 22px -12px rgba(17,122,99,.55);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;font-size:15px;color:var(--ink);background:var(--paper);
    background-image:radial-gradient(900px 480px at 100% -8%,rgba(17,122,99,.07),transparent 62%),radial-gradient(700px 420px at -8% 100%,rgba(17,122,99,.05),transparent 60%);-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.serif{font-family:'Source Serif 4',Georgia,serif;letter-spacing:-.012em;}
  .top{background:linear-gradient(100deg,var(--teal-900),var(--teal-deep) 60%,#0d6252);color:#fff;padding:0;position:sticky;top:0;z-index:20;box-shadow:0 6px 24px -12px rgba(3,32,26,.7);}
  .top-in{max-width:820px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;gap:12px;}
  .top .logo{width:34px;height:34px;flex:none;filter:drop-shadow(0 3px 8px rgba(3,32,26,.4));}
  .top .logo svg{width:100%;height:100%;display:block;}
  .top .nm{font-size:14px;font-weight:700;line-height:1.2;}
  .top .nm small{display:block;font-weight:500;font-size:10.5px;color:#9fc7bb;margin-top:1px;}
  .top .timer{margin-left:auto;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:5px 13px;}
  .top .timer.warn{background:rgba(156,43,43,.35);border-color:rgba(255,180,180,.4);color:#ffe0e0;}
  .top .timer .dot{width:7px;height:7px;border-radius:50%;background:#4fe0bd;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .wrap{max-width:820px;margin:0 auto;padding:26px 22px 70px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:0 2px 8px rgba(3,32,26,.06),0 30px 70px -45px rgba(3,32,26,.4);padding:30px 32px;}
  .prog{display:flex;gap:5px;margin-bottom:22px;}
  .prog .seg{flex:1;height:5px;border-radius:20px;background:var(--line);overflow:hidden;}
  .prog .seg.done{background:var(--teal);}
  .prog .seg.cur{background:linear-gradient(90deg,var(--teal),var(--teal-200));}
  .mod-tag{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--teal-deep);text-transform:uppercase;letter-spacing:.06em;background:var(--teal-50);border:1px solid var(--teal-100);border-radius:20px;padding:5px 12px;margin-bottom:16px;}
  h1{font-size:27px;margin:0 0 10px;}
  h2{font-size:21px;margin:0 0 8px;}
  .lead{color:var(--ink-soft);font-size:15px;line-height:1.65;margin:0 0 18px;}
  .q{font-size:18px;font-weight:600;line-height:1.5;margin:6px 0 18px;}
  .q .sub{display:block;font-size:13px;color:var(--ink-soft);font-weight:500;margin-top:6px;}
  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;cursor:pointer;transition:border-color .14s,background .14s,transform .1s;font-size:15px;line-height:1.45;}
  .opt:hover{border-color:var(--teal-200);background:var(--teal-50);}
  .opt.sel{border-color:var(--teal);background:var(--teal-50);box-shadow:0 0 0 3px rgba(17,122,99,.12);}
  .opt .key{width:26px;height:26px;flex:none;border-radius:8px;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--ink-soft);}
  .opt.sel .key{background:var(--teal);color:#fff;border-color:var(--teal);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--r-sm);padding:13px 26px;font-family:inherit;font-weight:700;font-size:15px;color:#fff;cursor:pointer;background:linear-gradient(180deg,var(--teal),#0e6c58);box-shadow:var(--sh-teal);transition:transform .12s,box-shadow .18s,background .16s;}
  .btn:hover:not(:disabled){background:linear-gradient(180deg,#13876d,var(--teal-deep));}
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line-strong);box-shadow:none;}
  .btn-ghost:hover:not(:disabled){background:var(--panel-alt);}
  .foot-row{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px;}
  .qcount{font-size:13px;color:var(--ink-mute);font-weight:600;}
  .qtimer{height:6px;border-radius:20px;background:var(--line);overflow:hidden;margin-bottom:22px;}
  .qtimer > div{height:100%;background:linear-gradient(90deg,var(--teal-400),var(--teal));transition:width 1s linear;}
  .qtimer.warn > div{background:linear-gradient(90deg,#d88,var(--bad));}
  /* görsel hafıza ızgara */
  .grid{display:grid;gap:8px;margin:8px auto 6px;width:max-content;}
  .cell{width:62px;height:62px;border-radius:12px;background:var(--panel-alt);border:2px solid var(--line);transition:background .12s,border-color .12s,transform .1s;}
  .cell.on{background:linear-gradient(140deg,var(--teal-400),var(--teal-deep));border-color:var(--teal-deep);box-shadow:var(--sh-teal);}
  .cell.pick{cursor:pointer;}
  .cell.pick:hover{border-color:var(--teal-200);}
  .cell.sel{background:linear-gradient(140deg,#8fd7c6,var(--teal));border-color:var(--teal);}
  .center{text-align:center;}
  .countbig{font-family:'Source Serif 4',serif;font-size:72px;font-weight:700;color:var(--teal-deep);line-height:1;}
  /* likert */
  .lik{display:flex;gap:8px;justify-content:space-between;margin-top:12px;}
  .lik button{flex:1;padding:11px 4px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-family:inherit;font-weight:700;font-size:14px;color:var(--ink-soft);cursor:pointer;transition:.12s;}
  .lik button.sel{background:var(--teal);color:#fff;border-color:var(--teal);}
  .lik-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-mute);margin-top:6px;}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;background:var(--teal-50);color:var(--teal-deep);border:1px solid var(--teal-100);}
  .info-box{background:var(--teal-50);border:1px solid var(--teal-100);border-radius:var(--r);padding:14px 16px;font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin:16px 0;}
  .mlist{display:grid;gap:10px;margin:16px 0 4px;}
  .mrow{display:flex;align-items:center;gap:13px;padding:12px 15px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel-alt);}
  .mrow .n{width:30px;height:30px;flex:none;border-radius:9px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
  .mrow b{font-size:14.5px;}
  .mrow .d{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}
  .mrow .t{margin-left:auto;font-size:12px;color:var(--ink-mute);font-weight:600;white-space:nowrap;}
  .done-ic{width:84px;height:84px;border-radius:50%;background:linear-gradient(140deg,var(--teal-400),var(--teal-deep));display:flex;align-items:center;justify-content:center;margin:0 auto 22px;box-shadow:var(--sh-teal);}
  @media(max-width:560px){.card{padding:22px 18px;}.cell{width:52px;height:52px;}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>

<div class="top"><div class="top-in">
  <span class="logo"><svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fb094"/><stop offset=".55" stop-color="#117a63"/><stop offset="1" stop-color="#0b5548"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#lg)"/><circle cx="20" cy="14.6" r="5.1" fill="#fff"/><path d="M9.8 31.6c0-6 4.6-9.3 10.2-9.3s10.2 3.3 10.2 9.3z" fill="#fff"/><path d="M27.6 10.4c2.7 1.2 4.5 3.8 4.8 6.8" fill="none" stroke="#e6b45a" stroke-width="2.2" stroke-linecap="round"/></svg></span>

<script type="module">

/* ============ BOYUTLAR ============ */

/* ============ DURUM ============ */
let AS = null, TOKEN = null, POZID = null, P = null;
let cevaplar = {}; // her modülün ham cevapları
let puan = {};     // boyut → toplam puan
let puanMax = {};  // boyut → maksimum
let modUI = { list:[], idx:0 };
let genelTimer = null, genelKalan = 0;

function addPuan(dim, val, max){ if(!dim) return; puan[dim]=(puan[dim]||0)+val; puanMax[dim]=(puanMax[dim]||0)+max; }

/* ---- yükleme ---- */
async function boot(){
  const params = new URLSearchParams(location.search);
  TOKEN = params.get("t");
  if(!TOKEN){ return mesaj("Geçersiz Bağlantı","Bu sınav bağlantısı eksik görünüyor. Lütfen İnsan Kaynakları ekibinden gelen bağlantıyı kullanın."); }
  try{
    const snap = await getDoc(doc(db,"iseAlimAssessment",TOKEN));
    if(!snap.exists()){ return mesaj("Bağlantı Bulunamadı","Bu sınav bağlantısı geçersiz veya süresi dolmuş. Lütfen İnsan Kaynakları ile iletişime geçin."); }
    AS = snap.data();
    if(AS.durum==="tamamlandi"){ return mesaj("Sınav Tamamlandı","Bu değerlendirme daha önce tamamlanmış görünüyor. Katılımınız için teşekkür ederiz."); }
    POZID = AS.pozisyon; P = POZ[POZID];
    if(!P){ return mesaj("Hazırlık Sürüyor","Bu pozisyon için sınav içeriği henüz hazır değil. Lütfen İnsan Kaynakları ile iletişime geçin."); }
    intro();
  }catch(e){ mesaj("Bir Sorun Oluştu","Sınav yüklenirken bir hata oluştu: "+e.message+". Lütfen sayfayı yenileyin."); }
}

function mesaj(baslik, metin){
  $("timer").hidden = true;
  app$.innerHTML = `<div class="card center"><div class="done-ic"><svg width="42" height="42" viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.01M12 3l9 16H3z" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h1>${esc(baslik)}</h1><p class="lead" style="max-width:46ch;margin:0 auto">${esc(metin)}</p></div>`;
}

/* ---- intro ---- */
function intro(){
  const mods = [
    {ad:"Bilişsel Hız & Muhakeme",d:"Sayısal, sözel ve mantıksal sorular — süreyle yarışın.",t:"~10 dk"},
    {ad:"Görsel Hafıza & Dikkat",d:"Kısa süre gösterilen deseni hatırlayın.",t:"~5 dk"},
    {ad:"Durumsal Muhakeme",d:"Gerçek iş senaryolarında en doğru tepkiyi seçin.",t:"~8 dk"},
    {ad:P.sim.baslik,d:"Adım adım ilerleyen bir simülasyon.",t:"~8 dk"},
    {ad:"Çalışma Stili Envanteri",d:"Kendinizi en iyi yansıtan ifadeleri işaretleyin.",t:"~6 dk"}
  ];
  app$.innerHTML = `<div class="card">
    <span class="badge">${esc(P.ad)} · Değerlendirme</span>
    <h1 style="margin-top:14px">Merhaba${AS.adayAd?", "+esc(AS.adayAd.split(" ")[0]):""} 👋</h1>
    <p class="lead">İnciroğlu Otomotiv İnsan Kaynakları değerlendirme sınavına hoş geldiniz. Bu sınav <b>${esc(P.ad)}</b> pozisyonu için yetkinliklerinizi ölçer. Yaklaşık <b>35–45 dakika</b> sürer ve <b>5 bölümden</b> oluşur.</p>
    <div class="info-box"><b>Başlamadan önce:</b> Sessiz bir ortamda, tek seferde tamamlayın. Bazı bölümler <b>süreyle yarışır</b> ve geri dönüş yoktur — her soruya odaklanın. İnternet bağlantınızın açık olduğundan emin olun.</div>
    <div class="mlist">${mods.map((m,i)=>`<div class="mrow"><span class="n">${i+1}</span><div><b>${esc(m.ad)}</b><div class="d">${esc(m.d)}</div></div><span class="t">${esc(m.t)}</span></div>`).join("")}</div>
    <div class="foot-row"><span class="qcount">Toplam 5 bölüm</span><button class="btn" id="basla">Sınava Başla →</button></div>
  </div>`;
  $("basla").onclick = startExam;
}

/* ---- sınav akışı ---- */
function startExam(){
  cevaplar={}; puan={}; puanMax={};
  // genel süre 45 dk
  genelKalan = 45*60;
  $("timer").hidden = false; tickGenel();
  genelTimer = setInterval(tickGenel, 1000);
  modUI.list = ["bilissel","hafiza","sjt","sim","envanter"];
  modUI.idx = 0;
  runMod();
}
function tickGenel(){
  const m=Math.floor(genelKalan/60), s=genelKalan%60;
  $("timerTxt").textContent = (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  $("timer").classList.toggle("warn", genelKalan<=120);
  if(genelKalan<=0){ clearInterval(genelTimer); return finish(); }
  genelKalan--;
}
function progHtml(active){
  return `<div class="prog">${modUI.list.map((_,i)=>`<div class="seg ${i<active?'done':i===active?'cur':''}"></div>`).join("")}</div>`;
}
function runMod(){
  if(modUI.idx>=modUI.list.length){ return finish(); }
  const m = modUI.list[modUI.idx];
  if(m==="bilissel") return modBilissel();
  if(m==="hafiza") return modHafiza();
  if(m==="sjt") return modSJT();
  if(m==="sim") return modSim();
  if(m==="envanter") return modEnvanter();
}
function nextMod(){ modUI.idx++; runMod(); }

/* ---- Modül 1: Bilişsel (süreli, soru başına 45sn) ---- */
function modBilissel(){
  const sorular = shuffle(BILISSEL.slice()).slice(0,14);
  cevaplar.bilissel=[];
  let i=0, qTimer=null;
  function q(){
    if(i>=sorular.length){ if(qTimer) clearInterval(qTimer); return nextMod(); }
    const s=sorular[i]; let kalan=45, sel=null;
    app$.innerHTML = `<div class="card">${progHtml(0)}
      <span class="mod-tag">⚡ Bölüm 1 · Bilişsel Hız & Muhakeme</span>
      <div class="qtimer" id="qt"><div style="width:100%"></div></div>
      <div class="q">${esc(s.t)}</div>
      <div class="opts">${s.o.map((o,k)=>`<div class="opt" data-k="${k}"><span class="key">${String.fromCharCode(65+k)}</span><span>${esc(o)}</span></div>`).join("")}</div>
      <div class="foot-row"><span class="qcount">Soru ${i+1} / ${sorular.length}</span><button class="btn" id="ileri" disabled>İleri →</button></div>`;
    document.querySelectorAll(".opt").forEach(el=>el.onclick=()=>{ sel=+el.dataset.k; document.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===el)); $("ileri").disabled=false; });
    $("ileri").onclick = ()=>ver();
    function ver(){
      if(qTimer) clearInterval(qTimer);
      const dogru = sel===s.a;
      cevaplar.bilissel.push({q:s.t,sel,dogru});
      addPuan(s.dim, dogru?2:0, 2);
      i++; q();
    }
    qTimer=setInterval(()=>{ kalan--; const w=Math.max(0,kalan/45*100); const b=$("qt"); if(b){ b.firstChild.style.width=w+"%"; b.classList.toggle("warn",kalan<=10);} if(kalan<=0){ clearInterval(qTimer); ver(); } },1000);
  }
  q();
}

/* ---- Modül 2: Görsel Hafıza (ızgara-hatırlama, 4 tur) ---- */
function modHafiza(){
  cevaplar.hafiza=[]; let tur=0; const turlar=[{n:3,k:4},{n:4,k:4},{n:5,k:5},{n:6,k:5}];
  function run(){
    if(tur>=turlar.length){ return nextMod(); }
    const {n,k}=turlar[tur]; const toplam=k*k;
    const acik = shuffle([...Array(toplam).keys()]).slice(0,n);
    // göster
    app$.innerHTML = `<div class="card center">${progHtml(1)}
      <span class="mod-tag">🧠 Bölüm 2 · Görsel Hafıza & Dikkat</span>
      <div class="q" style="text-align:center">Deseni ezberleyin — birazdan kaybolacak</div>
      <div class="grid" style="grid-template-columns:repeat(${k},1fr)">${[...Array(toplam)].map((_,x)=>`<div class="cell ${acik.includes(x)?'on':''}"></div>`).join("")}</div>
      <div class="qcount" style="margin-top:14px">Tur ${tur+1} / ${turlar.length} · ${n} kare</div>`;
    const sure = 2500 + n*350;
    setTimeout(()=>sor(acik,k,toplam), sure);
  }
  function sor(acik,k,toplam){
    let sec=[];
    app$.innerHTML = `<div class="card center">${progHtml(1)}
      <span class="mod-tag">🧠 Bölüm 2 · Görsel Hafıza & Dikkat</span>
      <div class="q" style="text-align:center">Işıklı olan kareleri işaretleyin</div>
      <div class="grid" style="grid-template-columns:repeat(${k},1fr)">${[...Array(toplam)].map((_,x)=>`<div class="cell pick" data-x="${x}"></div>`).join("")}</div>
      <div class="foot-row" style="justify-content:center;margin-top:20px"><button class="btn" id="onayla">Onayla →</button></div>`;
    document.querySelectorAll(".cell.pick").forEach(el=>el.onclick=()=>{ const x=+el.dataset.x; if(sec.includes(x)){ sec=sec.filter(v=>v!==x); el.classList.remove("sel"); } else { sec.push(x); el.classList.add("sel"); } });
    $("onayla").onclick=()=>{
      const dogruSayi = sec.filter(x=>acik.includes(x)).length;
      const yanlis = sec.filter(x=>!acik.includes(x)).length;
      const net = Math.max(0, dogruSayi - yanlis);
      addPuan("hafiza", net, acik.length);
      addPuan("detay", net>=acik.length?1:0, 1);
      cevaplar.hafiza.push({acik:acik.length,dogru:dogruSayi,yanlis});
      tur++; run();
    };
  }
  run();
}

/* ---- Modül 3: SJT ---- */
function modSJT(){
  const list=P.sjt; cevaplar.sjt=[]; let i=0;
  function q(){
    if(i>=list.length){ return nextMod(); }
    const s=list[i]; let sel=null;
    app$.innerHTML = `<div class="card">${progHtml(2)}
      <span class="mod-tag">🧭 Bölüm 3 · Durumsal Muhakeme</span>
      <div class="q">${esc(s.t)}<span class="sub">Bu durumda en doğru bulduğunuz tepkiyi seçin.</span></div>
      <div class="opts">${s.o.map((o,k)=>`<div class="opt" data-k="${k}"><span class="key">${String.fromCharCode(65+k)}</span><span>${esc(o.t)}</span></div>`).join("")}</div>
      <div class="foot-row"><span class="qcount">Senaryo ${i+1} / ${list.length}</span><button class="btn" id="ileri" disabled>İleri →</button></div>`;
    document.querySelectorAll(".opt").forEach(el=>el.onclick=()=>{ sel=+el.dataset.k; document.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===el)); $("ileri").disabled=false; });
    $("ileri").onclick=()=>{
      const o=s.o[sel]; const maxP=maxOf(s.o);
      for(const dim in maxP){ addPuan(dim, (o.p&&o.p[dim])||0, maxP[dim]); }
      cevaplar.sjt.push({q:s.t,sel}); i++; q();
    };
  }
  q();
}
function maxOf(opts){ const m={}; opts.forEach(o=>{ for(const d in (o.p||{})){ m[d]=Math.max(m[d]||0,o.p[d]); } }); return m; }

/* ---- Modül 4: Simülasyon ---- */
function modSim(){
  const sim=P.sim; cevaplar.sim=[]; let i=0;
  // giriş
  app$.innerHTML = `<div class="card">${progHtml(3)}
    <span class="mod-tag">🎬 Bölüm 4 · ${esc(sim.baslik)}</span>
    <div class="info-box" style="font-size:14.5px;color:var(--ink)"><b>Senaryo:</b> ${esc(sim.giris)}</div>
    <p class="lead">Aşağıdaki adımlarda gerçek bir durumu adım adım yöneteceksiniz. Her adımda en doğru hamleyi seçin.</p>
    <div class="foot-row"><span class="qcount">${sim.adimlar.length} adım</span><button class="btn" id="simBas">Başla →</button></div>`;
  $("simBas").onclick=()=>adim();
  function adim(){
    if(i>=sim.adimlar.length){ return nextMod(); }
    const a=sim.adimlar[i]; let sel=null;
    app$.innerHTML = `<div class="card">${progHtml(3)}
      <span class="mod-tag">🎬 Bölüm 4 · ${esc(sim.baslik)}</span>
      <div class="q">${esc(a.durum)}</div>
      <div class="opts">${a.o.map((o,k)=>`<div class="opt" data-k="${k}"><span class="key">${String.fromCharCode(65+k)}</span><span>${esc(o.t)}</span></div>`).join("")}</div>
      <div class="foot-row"><span class="qcount">Adım ${i+1} / ${sim.adimlar.length}</span><button class="btn" id="ileri" disabled>İleri →</button></div>`;
    document.querySelectorAll(".opt").forEach(el=>el.onclick=()=>{ sel=+el.dataset.k; document.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===el)); $("ileri").disabled=false; });
    $("ileri").onclick=()=>{ const o=a.o[sel]; const mp=maxOf(a.o); for(const d in mp){ addPuan(d,(o.p&&o.p[d])||0,mp[d]); } cevaplar.sim.push(sel); i++; adim(); };
  }
}

/* ---- Modül 5: Envanter (Likert) ---- */
function modEnvanter(){
  const list=shuffle(ENVANTER.slice()); cevaplar.envanter=[]; let i=0;
  function q(){
    if(i>=list.length){ return finish(); }
    const s=list[i]; let sel=null;
    app$.innerHTML = `<div class="card">${progHtml(4)}
      <span class="mod-tag">🗂️ Bölüm 5 · Çalışma Stili Envanteri</span>
      <div class="q" style="margin-bottom:6px">${esc(s.t)}</div>
      <div class="lik" id="lik">${[1,2,3,4,5].map(v=>`<button data-v="${v}">${v}</button>`).join("")}</div>
      <div class="lik-lbl"><span>Kesinlikle katılmıyorum</span><span>Kesinlikle katılıyorum</span></div>
      <div class="foot-row"><span class="qcount">İfade ${i+1} / ${list.length}</span><button class="btn" id="ileri" disabled>İleri →</button></div>`;
    document.querySelectorAll("#lik button").forEach(b=>b.onclick=()=>{ sel=+b.dataset.v; document.querySelectorAll("#lik button").forEach(x=>x.classList.toggle("sel",x===b)); $("ileri").disabled=false; });
    $("ileri").onclick=()=>{ const val=s.ters?(6-sel):sel; addPuan(s.dim,(val-1)/4*2,2); cevaplar.envanter.push({q:s.t,v:sel}); i++; q(); };
  }
  q();
}

/* ---- bitiş & skorlama ---- */
async function finish(){
  if(genelTimer) clearInterval(genelTimer);
  $("timer").hidden = true;
  app$.innerHTML = `<div class="card center"><h2>Sonuçlar hesaplanıyor…</h2><p class="lead">Lütfen bekleyin, kaydediyoruz.</p></div>`;
  // boyut yüzdeleri
  const boyut = {};
  for(const d in puanMax){ boyut[d] = puanMax[d]>0 ? Math.round(puan[d]/puanMax[d]*100) : null; }
  // uygunluk skoru (pozisyon ağırlıkları)
  let us=0, wsum=0;
  for(const d in P.agirlik){ if(boyut[d]!=null){ us += boyut[d]*P.agirlik[d]; wsum += P.agirlik[d]; } }
  const uygunluk = wsum>0 ? Math.round(us/wsum) : null;
  const sonuc = {
    durum:"tamamlandi",
    tamamlanmaTarihi: new Date().toISOString().slice(0,10),
    boyutlar: boyut,
    uygunluk,
    cevaplar,
    guncellemeTarihi: serverTimestamp()
  };
  try{
    await setDoc(doc(db,"iseAlimAssessment",TOKEN), sonuc, {merge:true});
  }catch(e){ /* yine de teşekkür göster */ }
  app$.innerHTML = `<div class="card center">
    <div class="done-ic"><svg width="42" height="42" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h1>Sınav Tamamlandı 🎉</h1>
    <p class="lead" style="max-width:48ch;margin:0 auto">Teşekkür ederiz${AS.adayAd?", "+esc(AS.adayAd.split(" ")[0]):""}. Değerlendirmeniz İnsan Kaynakları ekibimize ulaştı. Sonuçlar İK tarafından incelenecek ve süreçle ilgili sizinle iletişime geçilecektir.</p>
    <p class="lead" style="color:var(--ink-mute);font-size:13px;margin-top:16px">Bu sekmeyi kapatabilirsiniz.</p>
  </div>`;
}

/* ---- yardımcı ---- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

boot();
